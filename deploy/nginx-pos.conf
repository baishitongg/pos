# nginx site for the ordering app. Replace order.example.com with your domain.
# Install: sudo cp /opt/pos/app/deploy/nginx-pos.conf /etc/nginx/sites-available/pos
#          sudo ln -s /etc/nginx/sites-available/pos /etc/nginx/sites-enabled/pos
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d order.example.com      (adds HTTPS)
server {
    listen 80;
    server_name order.example.com;

    client_max_body_size 6m;   # dish photo uploads (app limit is 5 MB)

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Live updates (Server-Sent Events): no buffering, long-lived connections.
    location ~ /stream$ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
